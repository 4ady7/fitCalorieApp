app = "fitcalorie-trial"
primary_region = "iad"

[build]

[deploy]
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/data/fitcalorie.sqlite"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "fitcalorie_data"
  destination = "/data"
  initial_size = "1gb"
