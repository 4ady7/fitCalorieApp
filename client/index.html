<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#e7f1f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitCalorie" />
    <title>FitCalorie</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b74'/%3E%3Cpath d='M8 20.5c2.2-4.8 4.2-7.2 8-7.2s5.8 2.4 8 7.2' fill='none' stroke='%23f3fbfb' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (function () {
        var allowed = { harbor: 1, orchard: 1, north: 1, ember: 1, ink: 1 };
        var paper = { harbor: '#e7f1f2', orchard: '#f6efe9', north: '#eef2f7', ember: '#f7f0e8', ink: '#f3f2ef' };
        var saved = 'harbor';
        try { saved = localStorage.getItem('fitcalorie-theme') || saved; } catch (error) {}
        var theme = allowed[saved] ? saved : 'harbor';
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', paper[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
